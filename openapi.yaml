openapi: 3.0.3
info:
  title: High-Concurrency Ticket Engine & Flash-Sale API
  description: |
    Production-ready API specification for a high-throughput, low-latency ticketing backend engine.
    Designed for high-concurrency flash sales, race condition prevention, multi-strategy database locking 
    (SKIP LOCKED, OCC versioning, Redis Lua, Pessimistic), idempotency handling, and automated hold expirations.
  version: 1.0.0
  contact:
    name: Backend Engineering Team
    email: engineering@ticketbook.io

servers:
  - url: http://localhost:8000
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health Check
      description: Stateless health check endpoint for Docker container probes and load balancers.
      operationId: healthCheck
      tags:
        - System Maintenance
      responses:
        '200':
          description: Engine is online and healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - engine
                  - version
                properties:
                  status:
                    type: string
                    example: healthy
                  engine:
                    type: string
                    example: online
                  version:
                    type: string
                    example: 1.0.0

  /api/v1/events:
    post:
      summary: Create Event & Bulk Inventory
      description: |
        Registers a new event and atomically generates its initial ticket inventory using a 
        singular PostgreSQL Common Table Expression (CTE) query to bypass ORM loop bottlenecks.
      operationId: createEvent
      tags:
        - Event Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Event created and tickets generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCreateResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'

    get:
      summary: List Active Events
      description: Fetches active events with paginated results and live available ticket counts.
      operationId: listEvents
      tags:
        - Event Management
      parameters:
        - name: limit
          in: query
          description: Maximum number of events to return
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of events to skip
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Paginated list of active events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/v1/events/{event_id}:
    get:
      summary: Get Event Details & Availability
      description: Retrieves event metadata alongside live ticket status breakdown (AVAILABLE, RESERVED, CONFIRMED).
      operationId: getEventById
      tags:
        - Event Management
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
      responses:
        '200':
          description: Event details and live capacity metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/v1/events/{event_id}/seats:
    get:
      summary: Get Seat Map Matrix
      description: Returns all individual seats/tickets for an event including section, row, seat number, current status, and OCC version_id.
      operationId: getSeatMap
      tags:
        - Event Management
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
      responses:
        '200':
          description: Real-time seating availability matrix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMapResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/v1/events/{event_id}/reserve-any:
    post:
      summary: Mode A: Flash-Sale Auto-Allocation (General Admission)
      description: |
        Reserves ANY 1 available ticket in the event using high-concurrency non-blocking strategies.
        Designed for flash sales where users don't pick specific seat IDs.
      operationId: reserveAnyTicket
      tags:
        - Concurrency Reservation Engine
      parameters:
        - $ref: '#/components/parameters/EventIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveAnyRequest'
      responses:
        '201':
          description: Ticket successfully locked and held for 10 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationHoldResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409SoldOutOrContention'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/v1/tickets/{ticket_id}/reserve:
    post:
      summary: Mode B: Reserve Specific Seat (Assigned Seating)
      description: |
        Reserves a specific seat by ticket_id using Optimistic Concurrency Control (OCC) version checking 
        or Pessimistic locking to guarantee zero double-bookings on identical physical seats.
      operationId: reserveSpecificSeat
      tags:
        - Concurrency Reservation Engine
      parameters:
        - name: ticket_id
          in: path
          description: Target ticket/seat ID to reserve
          required: true
          schema:
            type: integer
            example: 142
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveSpecificRequest'
      responses:
        '201':
          description: Specific seat successfully locked and held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationHoldResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409SeatAlreadyTaken'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/v1/tickets/confirm:
    post:
      summary: Confirm Ticket Checkout
      description: Finalizes payment for a held reservation token and transitions ticket status from RESERVED to CONFIRMED.
      operationId: confirmTicketCheckout
      tags:
        - Concurrency Reservation Engine
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutConfirmRequest'
      responses:
        '200':
          description: Ticket payment confirmed and booking finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutConfirmResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Hold token has expired or ticket is no longer in RESERVED state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/v1/tickets/release-expired:
    post:
      summary: Async Hold Expiration Sweep
      description: Sweeps for tickets whose reservation holds have exceeded the 10-minute TTL and safely resets them to AVAILABLE.
      operationId: sweepExpiredHolds
      tags:
        - Concurrency Reservation Engine
      responses:
        '200':
          description: Expiration sweep executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - released_count
                  - timestamp
                properties:
                  status:
                    type: string
                    example: success
                  released_count:
                    type: integer
                    example: 14
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-07-28T18:30:00Z"
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/v1/metrics/concurrency:
    get:
      summary: Concurrency & Lock Metrics Dashboard
      description: Live telemetry metrics on database lock contention, throughput, active holds, and strategy performance.
      operationId: getConcurrencyMetrics
      tags:
        - Observability & Metrics
      responses:
        '200':
          description: High-concurrency metrics payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '500':
          $ref: '#/components/responses/500InternalError'

components:
  parameters:
    EventIdParam:
      name: event_id
      in: path
      description: Numeric ID of the event
      required: true
      schema:
        type: integer
        example: 1
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: Unique UUID key to enforce request idempotency during network retries.
      required: false
      schema:
        type: string
        format: uuid
        example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"

  responses:
    400BadRequest:
      description: Bad request or invalid payload format.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 400
            error: BAD_REQUEST
            message: "Invalid event date format or missing required payload parameters."
            timestamp: "2026-07-28T18:30:00Z"

    404NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 404
            error: NOT_FOUND
            message: "Event with ID 999 does not exist."
            timestamp: "2026-07-28T18:30:00Z"

    409SoldOutOrContention:
      description: Flash-sale event is 100% sold out or lock contention failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 409
            error: EVENT_SOLD_OUT
            message: "No available tickets remaining for this event under high demand."
            timestamp: "2026-07-28T18:30:00Z"

    409SeatAlreadyTaken:
      description: Specific seat OCC version check failed (Seat already reserved by another user).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status_code: 409
            error: OCC_VERSION_MISMATCH
            message: "Seat 142 has already been reserved by another transaction."
            timestamp: "2026-07-28T18:30:00Z"

    422ValidationError:
      description: Pydantic schema validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    500InternalError:
      description: Internal server exception.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - status_code
        - error
        - message
        - timestamp
      properties:
        status_code:
          type: integer
          example: 400
        error:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: "Detailed human-readable failure explanation."
        details:
          type: object
          nullable: true
          example: null
        timestamp:
          type: string
          format: date-time
          example: "2026-07-28T18:30:00Z"

    EventCreateRequest:
      type: object
      required:
        - tenant_id
        - title
        - date
        - max_capacity
      properties:
        tenant_id:
          type: integer
          example: 1
        title:
          type: string
          example: "Coldplay Music of the Spheres World Tour"
        category:
          type: string
          example: "Concert"
        date:
          type: string
          format: date-time
          example: "2026-10-15T20:00:00Z"
        base_price:
          type: integer
          example: 150
        max_capacity:
          type: integer
          minimum: 1
          maximum: 100000
          example: 5000

    EventCreateResponse:
      type: object
      required:
        - status
        - message
        - event_id
        - generated_tickets_count
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: "Event 101 and 5000 tickets successfully generated via CTE query."
        event_id:
          type: integer
          example: 101
        generated_tickets_count:
          type: integer
          example: 5000

    EventSummary:
      type: object
      required:
        - id
        - tenant_id
        - title
        - date
        - max_capacity
        - available_tickets_count
        - is_active
      properties:
        id:
          type: integer
          example: 1
        tenant_id:
          type: integer
          example: 1
        title:
          type: string
          example: "Rock Night 2026"
        category:
          type: string
          example: "Music"
        date:
          type: string
          format: date-time
          example: "2026-11-01T19:00:00Z"
        base_price:
          type: integer
          example: 100
        max_capacity:
          type: integer
          example: 1000
        available_tickets_count:
          type: integer
          example: 342
        is_active:
          type: boolean
          example: true

    EventListResponse:
      type: object
      required:
        - status
        - count
        - data
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'

    EventDetailResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          required:
            - event
            - inventory_summary
          properties:
            event:
              $ref: '#/components/schemas/EventSummary'
            inventory_summary:
              type: object
              required:
                - total_tickets
                - available_count
                - reserved_count
                - confirmed_count
              properties:
                total_tickets:
                  type: integer
                  example: 1000
                available_count:
                  type: integer
                  example: 342
                reserved_count:
                  type: integer
                  example: 58
                confirmed_count:
                  type: integer
                  example: 600

    SeatItem:
      type: object
      required:
        - id
        - event_id
        - seat_number
        - status
        - version_id
      properties:
        id:
          type: integer
          example: 142
        event_id:
          type: integer
          example: 1
        section:
          type: string
          nullable: true
          example: "Floor A"
        row:
          type: string
          nullable: true
          example: "Row 5"
        seat_number:
          type: string
          example: "Seat-142"
        status:
          type: string
          enum: [AVAILABLE, RESERVED, CONFIRMED]
          example: "AVAILABLE"
        version_id:
          type: integer
          example: 1

    SeatMapResponse:
      type: object
      required:
        - status
        - event_id
        - total_seats
        - seats
      properties:
        status:
          type: string
          example: success
        event_id:
          type: integer
          example: 1
        total_seats:
          type: integer
          example: 1000
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatItem'

    ReserveAnyRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          example: 42

    ReserveSpecificRequest:
      type: object
      required:
        - user_id
        - expected_version_id
      properties:
        user_id:
          type: integer
          example: 42
        expected_version_id:
          type: integer
          description: Expected OCC version token read prior to update
          example: 1

    ReservationHoldResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: "Ticket successfully locked and held."
        data:
          type: object
          required:
            - reservation_token
            - ticket_id
            - event_id
            - user_id
            - reserved_at
            - expires_at
          properties:
            reservation_token:
              type: string
              format: uuid
              example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"
            ticket_id:
              type: integer
              example: 142
            event_id:
              type: integer
              example: 1
            user_id:
              type: integer
              example: 42
            reserved_at:
              type: string
              format: date-time
              example: "2026-07-28T18:30:00Z"
            expires_at:
              type: string
              format: date-time
              example: "2026-07-28T18:40:00Z"

    CheckoutConfirmRequest:
      type: object
      required:
        - reservation_token
        - ticket_id
        - user_id
      properties:
        reservation_token:
          type: string
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"
        ticket_id:
          type: integer
          example: 142
        user_id:
          type: integer
          example: 42
        payment_reference:
          type: string
          example: "pay_sim_9921823"

    CheckoutConfirmResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: "Payment confirmed. Ticket status updated to CONFIRMED."
        data:
          type: object
          required:
            - ticket_id
            - event_id
            - user_id
            - status
            - confirmed_at
          properties:
            ticket_id:
              type: integer
              example: 142
            event_id:
              type: integer
              example: 1
            user_id:
              type: integer
              example: 42
            status:
              type: string
              example: "CONFIRMED"
            confirmed_at:
              type: string
              format: date-time
              example: "2026-07-28T18:32:15Z"

    MetricsResponse:
      type: object
      required:
        - status
        - metrics
      properties:
        status:
          type: string
          example: success
        metrics:
          type: object
          required:
            - active_events
            - total_inventory
            - active_holds
            - confirmed_bookings
            - locking_strategy_performance
          properties:
            active_events:
              type: integer
              example: 5
            total_inventory:
              type: integer
              example: 25000
            active_holds:
              type: integer
              example: 140
            confirmed_bookings:
              type: integer
              example: 18200
            locking_strategy_performance:
              type: object
              properties:
                skip_locked_avg_ms:
                  type: number
                  example: 12.4
                occ_version_retry_rate:
                  type: number
                  example: 0.04
                redis_lua_avg_ms:
                  type: number
                  example: 3.2
