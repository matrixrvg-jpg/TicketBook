version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ticketbook_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ticket_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: ticketbook_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Connects to the 'db' container using Docker's internal DNS
      - DATABASE_URL=postgresql+psycopg://postgres:password123@db:5432/ticket_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: ticketbook_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
